<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BurgerHouse – Burgers, Pizza &amp; Salads | Bestell App</title>
    <meta
      name="description"
      content="Order burgers, pizza and salads from BurgerHouse. Demo project of a food delivery app with a working basket."
    />
    <meta name="theme-color" content="#E76C1F" />

    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/basket.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <script src="js/data.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/templates.js" defer></script>
    <script src="js/basket.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/dialogs.js" defer></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#menu">Skip to menu</a>
    <p class="visually-hidden" id="basketAnnouncer" role="status" aria-live="polite"></p>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#top" aria-label="Bestell App – back to top">
          <svg class="icon brand__logo" aria-hidden="true" focusable="false">
            <use href="#icon-logo"></use>
          </svg>
          <span class="brand__mobile" aria-hidden="true">
            <svg class="icon brand__bag" focusable="false"><use href="#icon-bag"></use></svg>
            <span class="brand__text">
              <span class="brand__small">Bestell</span>
              <span class="brand__big">App</span>
            </span>
          </span>
        </a>

        <!-- Platzhalter laut Figma-Notiz: Die Menüleiste hat keine Funktion -->
        <button class="header-menu-button" type="button" aria-disabled="true" aria-label="Menu (placeholder)">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-menu"></use></svg>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="restaurant" aria-labelledby="restaurantName">
        <div class="restaurant__hero">
          <img
            class="restaurant__image"
            src="assets/img/hero.jpg"
            alt="A table full of burgers, pizzas, fries and salads"
            width="1600"
            height="1067"
          />
          <img
            class="restaurant__logo"
            src="assets/img/logo-burgerhouse.jpg"
            alt="BurgerHouse logo"
            width="200"
            height="200"
          />
        </div>

        <div class="restaurant__info">
          <div class="restaurant__headline">
            <h1 class="restaurant__name" id="restaurantName"><span>Burger</span>House</h1>
            <p class="rating" aria-label="Rated 4.1 out of 5 stars by 317 guests">
              <svg class="icon rating__star" aria-hidden="true" focusable="false">
                <use href="#icon-star"></use>
              </svg>
              <span class="rating__score">4,1</span>
              <span class="rating__count">(317)</span>
            </p>
          </div>
          <p class="restaurant__tagline">The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </div>
      </section>

      <div class="menu-layout" id="menu">
        <div class="menu" id="menuList"></div>

        <aside class="basket-column" aria-label="Your basket">
          <div class="basket js-basket"></div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <ul class="site-footer__list">
        <li class="site-footer__copyright">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-copyright"></use></svg>
          2025 BurgerHouse
        </li>
        <li><a href="#top">Imprint</a></li>
        <li><a href="#top">Cookie Preferences</a></li>
      </ul>
    </footer>

    <nav class="bottom-bar" aria-label="App navigation">
      <a class="bottom-bar__item" href="#top" aria-label="Home">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-home"></use></svg>
      </a>
      <button class="bottom-bar__item" type="button" aria-disabled="true" aria-label="Profile (placeholder)">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-person"></use></svg>
      </button>
      <button class="bottom-bar__item" type="button" aria-disabled="true" aria-label="Orders (placeholder)">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-takeout"></use></svg>
      </button>
      <button
        class="bottom-bar__item"
        id="openBasketButton"
        type="button"
        data-action="toggleBasket"
        aria-expanded="false"
        aria-controls="basketDialog"
        aria-label="Open basket"
      >
        <span class="bottom-bar__icon">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-cart"></use></svg>
          <span class="bottom-bar__badge" id="basketBadge" hidden>0</span>
        </span>
      </button>
    </nav>

    <div class="sheet-backdrop" id="sheetBackdrop" data-action="closeBasket" hidden></div>
    <dialog class="dialog basket-dialog" id="basketDialog" aria-label="Your basket">
      <button class="dialog__close" type="button" data-action="closeBasket" aria-label="Close basket">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg>
      </button>
      <div class="basket js-basket"></div>
    </dialog>

    <dialog class="dialog confirmation" id="confirmationDialog" aria-labelledby="confirmationTitle">
      <button class="dialog__close" type="button" data-action="closeConfirmation" aria-label="Close message">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg>
      </button>
      <img
        class="confirmation__image"
        src="assets/img/icons/delivery-van.png"
        alt=""
        width="80"
        height="61"
      />
      <h2 class="confirmation__title" id="confirmationTitle">Order confirmed!</h2>
      <p class="confirmation__text">Your food is on the way!</p>
    </dialog>
